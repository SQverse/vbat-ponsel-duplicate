/* ---- TOMBOL CSS ---- */
.btn {

  text-align: center;
  text-decoration: none;
  font-weight: 800;
  padding: 18px 28px;
  border-radius: 25px;
  font-size: 1.05rem;
  width: 100%;
  max-width: 550px; 
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:active { transform: scale(.97); }

.btn-biru {
  background: linear-gradient(100deg, var(--biru), var(--biru-muda));
  color: var(--putih);
  box-shadow: 0 10px 24px rgba(29,78,216,.35);

}

.btn-alumni {

  color: var(--putih);
  border: 1px solid rgba(255,255,255,0.2);
}

/* ---- STICKY CTA ---- */
.sticky-cta {
  position: fixed;
  bottom: 0; left: 0; right: 0; z-index: 99;
  background: rgba(6,18,41,.9);
  backdrop-filter: blur(8px);
  padding: 12px 16px;
  border-top: 1px solid rgba(232,193,90,.5);
}
.sticky-cta .btn {
  margin: 0 auto;
  padding: 14px 20px;
  font-size: 1rem;
}

.hero-wrapper {
  position: relative;
  width: 100%;
  margin-bottom: -1px;
}
.hero-btn-area {
  position: absolute;
  bottom: 12%; 
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  padding: 0 5%;
}
.hero-btn-area .btn {
  box-shadow: 0 8px 24px rgba(0,0,0,0.7); 
}

/* ---- SECTION BENEFIT (DARK MODE) ---- */
.section-benefit {
  background-color: var(--navy); 
  width: 100%;
  margin-top: -1px;
}
.wrap-benefit {      
  display: flex;
  flex-direction: column;
  align-items: center;
}
.img-benefit {
  width: 100%;
  max-width: 800px;
  display: block;

/* ---- SLIDER TESTIMONI 3 HP (FIX UKURAN RAKSASA) ---- */

  position: relative;
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
}

.halaman7-bg {
  width: 100%;
  display: block;
}

.halaman7-slider-area {
  position: absolute;
  top: 25%;   
  bottom: 10%; 
  left: 0;
  right: 0;
  padding: 0 3%;
  display: flex;
  align-items: center; 
}

.slider-3hp {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding-bottom: 8px;
  -webkit-overflow-scrolling: touch;
  width: 100%;
  height: 100%; 
  align-items: center;
}

/* Custom Scrollbar */
.slider-3hp::-webkit-scrollbar { height: 5px; }
.slider-3hp::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
.slider-3hp::-webkit-scrollbar-thumb { background: var(--biru); border-radius: 10px; }

.hp-item {
  flex: 0 0 calc(33.333% - 6px); 
  height: 100%; 
  width: 100%;
  object-fit: contain; 
  scroll-snap-align: start; 
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); 
}
