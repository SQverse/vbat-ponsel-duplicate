<style>
:root {
  --navy: #061229;          
  --biru: #1D4ED8;          
  --biru-muda: #4DA3FF;     
  --putih: #FBFDFF;
  --emas: #C9A227;          
  --emas-terang: #E8C15A;   
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; background: var(--navy); }
body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--navy); padding-bottom: 84px; }

/* ---- GAMBAR FULL WIDTH (FIX CELAH PUTIH) ---- */
.img-section {
  width: 100%;
  height: auto;
  vertical-align: top;
  margin-bottom: -1px; 
}

/* ---- BUNGKUSAN TOMBOL UMUM ---- */
.action-area {
  width: 100%;
  background-color: var(--navy); 
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-top: -1px; 
}

/* ---- TOMBOL CSS ---- */
.btn {
  display: block;
  text-align: center;
  text-decoration: none;
  font-weight: 800;
  padding: 18px 28px;
  border-radius: 25px;
  font-size: 1.05rem;
  width: 100%;
  max-width: 550px; 
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:active { transform: scale(.97); }

.btn-biru {
  background: linear-gradient(100deg, var(--biru), var(--biru-muda));
  color: var(--putih);
  box-shadow: 0 10px 24px rgba(29,78,216,.35);
  border: none;
}

.btn-alumni {
  background: #000000;
  color: var(--emas-terang);
  border: 1px solid var(--emas);
  box-shadow: 0 8px 24px rgba(201,162,39,.15);
}

.btn-playstore {
  background: linear-gradient(100deg, #101828, #1D2939);
  color: var(--putih);
  border: 1px solid rgba(255,255,255,0.2);
}

/* WARNA HIJAU UNTUK TOMBOL WA BARU */
.btn-wa {
  background: linear-gradient(100deg, #128C7E, #25D366);
  color: var(--putih);
  box-shadow: 0 8px 24px rgba(37,211,102,.35);
  border: none;
}

/* ---- STICKY CTA ---- */
.sticky-cta {
  position: fixed;
  bottom: 0; left: 0; right: 0; z-index: 99;
  background: rgba(6,18,41,.9);
  backdrop-filter: blur(8px);
  padding: 12px 16px;
  border-top: 1px solid rgba(232,193,90,.5);
}

.sticky-cta .btn {
  margin: 0 auto;
  padding: 10px 24px; 
  font-size: 0.95rem; 
  max-width: fit-content;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px; 
}

/* ---- HERO SECTION KHUSUS (TOMBOL MELAYANG) ---- */
.hero-wrapper {
  position: relative;
  width: 100%;
  margin-bottom: -1px;
}
.hero-btn-area {
  position: absolute;
  bottom: 12%; 
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  padding: 0 5%;
}
.hero-btn-area .btn {
  box-shadow: 0 8px 24px rgba(0,0,0,0.7); 
}

/* ---- SECTION BENEFIT (DARK MODE) ---- */
.section-benefit {
  background-color: var(--navy); 
  width: 100%;
  margin-top: -1px;
}
.wrap-benefit {      
  display: flex;
  flex-direction: column;
  align-items: center;
}
.img-benefit {
  width: 100%;
  max-width: 800px;
  display: block;
}

/* ---- SLIDER TESTIMONI 3 HP ---- */
.halaman7-wrapper {
  position: relative;
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
}

.halaman7-bg {
  width: 100%;
  display: block;
}

.halaman7-slider-area {
  position: absolute;
  top: 25%;   
  bottom: 10%; 
  left: 0;
  right: 0;
  padding: 0 3%;
  display: flex;
  align-items: center; 
}

.slider-3hp {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding-bottom: 8px;
  -webkit-overflow-scrolling: touch;
  width: 100%;
  height: 100%; 
  align-items: center;
}

.slider-3hp::-webkit-scrollbar { height: 5px; }
.slider-3hp::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
.slider-3hp::-webkit-scrollbar-thumb { background: var(--biru); border-radius: 10px; }

.hp-item {
  flex: 0 0 calc(33.333% - 6px); 
  height: 100%; 
  width: 100%;
  object-fit: contain; 
  scroll-snap-align: start; 
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); 
}

/* ---- HALAMAN 10 KHUSUS (TOMBOL DOWNLOAD GAMBAR) ---- */
.halaman10-wrapper {
  position: relative;
  width: 100%;
  margin-bottom: -1px;
}
.halaman10-btn-area {
  position: absolute;
  bottom: 8%; 
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5%; /* Menjaga jarak antar tombol agar tidak berdempetan */
  padding: 0 8%;
}
.halaman10-btn-area a {
  display: block;
  width: 38%; /* DIKECILKAN: Sebelumnya 48%, sekarang 38% agar lebih rapi */
  max-width: 240px; /* Batas maksimal ukuran agar tidak jadi raksasa di PC */
  transition: transform .15s ease;
}
.halaman10-btn-area a:active {
  transform: scale(0.95); 
}
.halaman10-btn-area img {
  width: 100%;
  height: auto;
  display: block;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4)); 
}

/* Responsive Adjustments untuk tablet dan HP */
@media(max-width: 768px) {
  .btn {font-size: 0.95rem; width: 60vw;}

  .hero-btn-area { bottom: 10%; }

@media(max-width: 600px) {

  .sticky-cta .btn {

@media(max-width: 576px) {

  .btn-playstore { font-size: 11px;}

@media(max-width: 480px) {
